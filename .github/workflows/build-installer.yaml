name: Build Windows Installer

# Builds AvatarLive-Setup-<version>-Lite.exe:
#   plugin DLL (obs-plugintemplate build) + avatar-engine.exe (PyInstaller, Lite = CPU ONNX Runtime,
#   no CUDA) + Inno Setup. The installer is uploaded as a workflow artifact. It is attached to a
#   draft GitHub Release when either
#     - a "v*" tag is pushed, or
#     - the workflow is run manually on main with a version (creates tag v<version> on publish).
#   See docs/RELEASING.md. No face-swap model weights are included.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without "v" (e.g. 0.1.2). Must match buildspec.json. Leave empty to only build.'
        required: false
        default: ''
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-installer-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Installer (Windows, Lite)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build plugin (obs-plugintemplate) 🧱
        run: .github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Locate plugin DLL
        id: dll
        run: |
          $dll = Get-ChildItem -Path build_x64 -Recurse -Filter obs-avatar-live.dll |
            Where-Object { $_.FullName -match 'RelWithDebInfo' } | Select-Object -First 1
          if (-not $dll) { throw 'obs-avatar-live.dll not found under build_x64' }
          Write-Host "Plugin DLL: $($dll.FullName)"
          $rel = [IO.Path]::GetRelativePath((Get-Location).Path, $dll.DirectoryName)
          "dir=$rel" >> $env:GITHUB_OUTPUT

      # DirectML build: CPU + any DirectX 12 GPU (incl. Intel/AMD integrated); never CUDA in Lite.
      - name: Build engine (PyInstaller, Lite) 🐍
        run: installer/windows/build_engine.ps1 -Variant Lite -Backend directml -Python python

      - name: Install Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }

      - name: Build installer 📀
        run: installer/windows/build_installer.ps1 -Variant Lite -PluginBuildDir "${{ steps.dll.outputs.dir }}"

      - name: Collect installer
        id: out
        run: |
          $exe = Get-ChildItem release -Filter 'AvatarLive-Setup-*-Lite.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Installer not produced' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "$($exe.FullName).sha256"
          Write-Host "$($exe.Name)  sha256=$hash  size=$([math]::Round($exe.Length / 1MB, 1)) MB"
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.BaseName)" >> $env:GITHUB_OUTPUT
          "### Installer`n``$($exe.Name)`` — SHA-256 ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - name: Test installer (silent install, OBS 33+ layout) 🧪
        run: |
          $exe = "${{ steps.out.outputs.path }}"
          $p = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "installer exit code $($p.ExitCode)" }
          $root = Join-Path $env:ProgramData 'obs-studio\plugins\obs-avatar-live'
          foreach ($f in 'obs-avatar-live.dll', 'data\locale\en-US.ini', 'data\engine\avatar-engine.exe', 'data\MODEL_MANIFEST.json') {
            if (-not (Test-Path (Join-Path $root $f))) { Get-ChildItem -Recurse $root | Select-Object -First 40; throw "missing after install: $f" }
          }
          if (Test-Path (Join-Path $root 'bin')) { throw 'legacy bin\64bit folder present in OBS 33+ layout' }
          & (Join-Path $root 'data\engine\avatar-engine.exe') selftest
          if ($LASTEXITCODE -ne 0) { throw 'installed engine selftest failed' }
          $probe = & (Join-Path $root 'data\engine\avatar-engine.exe') probe --json | Out-String | ConvertFrom-Json
          Write-Host "ONNX Runtime providers: $($probe.ort_providers_installed -join ', ')"
          if ($probe.ort_providers_installed -notcontains 'DmlExecutionProvider') { throw 'DirectML provider missing from the Lite engine' }
          if ($probe.ort_providers_installed -contains 'CUDAExecutionProvider') { throw 'CUDA must not ship in the Lite engine' }
          Write-Host "Installed layout OK under $root"

      - name: Upload installer artifact 📡
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.out.outputs.name }}
          path: |
            release/AvatarLive-Setup-*-Lite.exe
            release/AvatarLive-Setup-*-Lite.exe.sha256
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    needs: installer
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.version != '' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: buildspec.json
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve and check version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then tag="${GITHUB_REF_NAME}"; else tag="v${INPUT_VERSION#v}"; fi
          ver="${tag#v}"
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::invalid version '$ver'"; exit 1; }
          spec="$(python3 -c 'import json;print(json.load(open("buildspec.json"))["version"])')"
          [[ "$ver" == "$spec" ]] || { echo "::error::version $ver does not match buildspec.json ($spec); bump it in a PR first"; exit 1; }
          ls dist/AvatarLive-Setup-"$ver"-Lite.exe dist/AvatarLive-Setup-"$ver"-Lite.exe.sha256
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create draft release (or update its files)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          notes="Instalador Lite (CPU, sin GPU dedicada). No incluye modelos de face swap. Compilación no validada en hardware de referencia; ver docs/ACCEPTANCE_TESTS.md."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists: replacing its installer files"
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            # --target: for a manual run the tag does not exist yet; GitHub creates it on this commit when published.
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "Avatar Live $TAG" --notes "$notes"
          fi
          echo "### Draft release $TAG" >> "$GITHUB_STEP_SUMMARY"
