[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar-engine"
version = "0.1.1"
description = "Out-of-process avatar engine for the OBS Avatar Live source"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }
dependencies = [
  "numpy>=1.24",
  "onnxruntime>=1.17",
  "opencv-python-headless>=4.8,<5",  # 5.x drops the bundled Haar cascades
  "sounddevice>=0.4.6",  # microphone (PortAudio, WASAPI shared mode)
  "cv2-enumerate-cameras>=1.1",  # camera names for the device list (MIT)
  "onnx>=1.15",  # reads the identity-mapping matrix (emap) embedded in inswapper-compatible models
]

[project.optional-dependencies]
openvino = ["onnxruntime-openvino>=1.17"]
directml = ["onnxruntime-directml>=1.17"]
system = ["psutil>=5.9"]
dev = ["pytest>=8", "psutil>=5.9"]

[project.scripts]
avatar-engine = "avatar_engine.main:main"

[tool.setuptools.packages.find]
include = ["avatar_engine*"]

[tool.setuptools.package-data]
avatar_engine = ["*.json"]
